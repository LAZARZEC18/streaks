<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streaks: habit tracker with a year heatmap</title>
  <meta name="description" content="Track daily and weekly habits, keep your streaks alive, and see your whole year as a contribution-style heatmap. Works offline and saves on your device.">
  <meta name="theme-color" content="#F3F5F7" id="theme-color">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Streaks">
  <meta property="og:description" content="A habit tracker with streaks and a year heatmap of everything you got done.">
  <meta property="og:url" content="https://lazarzec18.github.io/streaks/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23E8A100'/%3E%3Cg fill='%2315202B'%3E%3Crect x='7' y='7' width='5' height='5' rx='1.5' opacity='.35'/%3E%3Crect x='13.5' y='7' width='5' height='5' rx='1.5'/%3E%3Crect x='20' y='7' width='5' height='5' rx='1.5' opacity='.6'/%3E%3Crect x='7' y='13.5' width='5' height='5' rx='1.5'/%3E%3Crect x='13.5' y='13.5' width='5' height='5' rx='1.5' opacity='.6'/%3E%3Crect x='20' y='13.5' width='5' height='5' rx='1.5'/%3E%3Crect x='7' y='20' width='5' height='5' rx='1.5' opacity='.6'/%3E%3Crect x='13.5' y='20' width='5' height='5' rx='1.5'/%3E%3Crect x='20' y='20' width='5' height='5' rx='1.5' opacity='.35'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..600&display=swap">
  <script>
    try {
      var t = localStorage.getItem('streaks:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#habits-h">Skip to your habits</a>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="bm-bg" width="32" height="32" rx="9"/><g fill="#15202B"><rect x="7" y="7" width="5" height="5" rx="1.5" opacity=".35"/><rect x="13.5" y="7" width="5" height="5" rx="1.5"/><rect x="20" y="7" width="5" height="5" rx="1.5" opacity=".6"/><rect x="7" y="13.5" width="5" height="5" rx="1.5"/><rect x="13.5" y="13.5" width="5" height="5" rx="1.5" opacity=".6"/><rect x="20" y="13.5" width="5" height="5" rx="1.5"/><rect x="7" y="20" width="5" height="5" rx="1.5" opacity=".6"/><rect x="13.5" y="20" width="5" height="5" rx="1.5"/><rect x="20" y="20" width="5" height="5" rx="1.5" opacity=".35"/></g></svg>
      <div>
        <h1 class="wordmark">Streaks</h1>
        <p class="tagline">Check off your habits each day and watch the year fill in.</p>
      </div>
    </div>
    <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="Switch to dark theme">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main>
    <div class="tool">
      <section class="year" aria-labelledby="year-h">
        <div class="year-head">
          <div class="today-stat">
            <span class="today-num" id="today-num">0<span class="of">/0</span></span>
            <span class="today-label" id="today-label">done today</span>
          </div>
          <div class="year-meta">
            <h2 id="year-h">Your year</h2>
            <p class="muted" id="year-summary"></p>
          </div>
        </div>
        <div class="heat-scroll" id="heat-scroll">
          <div class="heat" id="heat">
            <div class="heat-months" id="heat-months" aria-hidden="true"></div>
            <div class="heat-days" aria-hidden="true"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
            <div class="heat-grid" id="heat-grid" role="group" aria-label="Habits done per day over the last year. Use arrow keys to move between days."></div>
          </div>
        </div>
        <div class="heat-foot">
          <p class="muted day-hint" id="day-hint">Pick any day to see or change what you did.</p>
          <div class="legend" aria-hidden="true">
            <span>Less</span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>More</span>
          </div>
        </div>
        <div class="day-panel" id="day-panel" hidden aria-live="polite"></div>
      </section>

      <section class="habits-sec" aria-labelledby="habits-h">
        <div class="habits-head">
          <h2 id="habits-h">Habits</h2>
          <div class="toolbar">
            <button type="button" class="pill ghost" id="example-btn">Load example</button>
            <button type="button" class="pill ghost" id="export-btn">Export backup</button>
            <button type="button" class="pill ghost" id="import-btn">Import backup</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
          </div>
        </div>
        <p class="error" id="io-error" role="alert"></p>
        <ol class="habits" id="habits"></ol>

        <div class="add-wrap">
          <button type="button" class="pill primary" id="add-open" aria-expanded="false" aria-controls="habit-form">Add habit</button>
          <form class="habit-form" id="habit-form" hidden novalidate>
            <h3 id="form-title">New habit</h3>
            <div class="field">
              <label for="h-name">Habit</label>
              <input id="h-name" type="text" maxlength="40" placeholder="Like: Read 20 pages" autocomplete="off">
            </div>
            <fieldset class="field">
              <legend>Icon</legend>
              <div class="emoji-pick" id="emoji-pick"></div>
            </fieldset>
            <fieldset class="field">
              <legend>Target</legend>
              <div class="target-row">
                <div class="segmented" id="target-type">
                  <label><input type="radio" name="ttype" value="daily" checked><span>Every day</span></label>
                  <label><input type="radio" name="ttype" value="weekly"><span>Times per week</span></label>
                </div>
                <label class="times" id="times-wrap" hidden>
                  <span class="sr-only">Times per week</span>
                  <select id="h-times">
                    <option value="1">1 a week</option><option value="2">2 a week</option><option value="3" selected>3 a week</option>
                    <option value="4">4 a week</option><option value="5">5 a week</option><option value="6">6 a week</option>
                  </select>
                </label>
              </div>
            </fieldset>
            <p class="error" id="form-error" role="alert"></p>
            <div class="form-actions">
              <button type="submit" class="pill primary" id="form-submit">Add habit</button>
              <button type="button" class="pill ghost" id="form-cancel">Cancel</button>
            </div>
          </form>
        </div>

        <details class="archived" id="archived" hidden>
          <summary id="archived-sum">Archived</summary>
          <ul class="archived-list" id="archived-list"></ul>
        </details>
      </section>
    </div>
  </main>

  <div class="tip" id="tip" role="presentation" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer">
    Made by Lazar Zec. <a href="https://github.com/LAZARZEC18/streaks">Source on GitHub</a>
  </footer>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
